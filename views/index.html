<!DOCTYPE html>

<html>
   <head>
      <title>File Metadata</title>
      <link rel="shortcut icon" href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png" type="image/x-icon"/>
      <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
      <link href="/public/style.css" rel="stylesheet" type="text/css">
   </head>

   <body>
      <div class="container">
        <h2>API Project: File Metadata Microservice</h2>

        <h3>Usage:</h3>
        <p>
          Please Upload a File ...
        </p>
        <div class="view">
          <h4 id="output"></h4>
          <form id="fileForm" enctype="multipart/form-data">
            <input id="inputfield" type="file" name="upfile">
            <input id="button" type="submit" value="Upload">
          </form>
        </div>
      </div>
      <div class="footer">
        <p>
          by 
          <a href="http://www.freecodecamp.com">freeCodeCamp</a>
        </p>
      </div>

      <script>
        document.getElementById('fileForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const fileInput = document.getElementById('inputfield');
          if (!fileInput.files.length) {
            document.getElementById('output').textContent = 'Please select a file';
            return;
          }

          const formData = new FormData();
          formData.append('upfile', fileInput.files[0]);
          
          try {
            const response = await fetch('/api/fileanalyse', {
              method: 'POST',
              body: formData
            });
            
            if (!response.ok) {
              throw new Error('Upload failed');
            }
            
            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data);
          } catch (error) {
            document.getElementById('output').textContent = 'Error: ' + error.message;
          }
        });
      </script>
   </body>
</html>
